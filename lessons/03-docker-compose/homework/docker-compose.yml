
services:
  # שירות greeter שמחזיר ברכה בעברית
  greeter-he:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Shalom
    ports:
      - "9001:8000"

  # שירות greeter שמחזיר ברכה באנגלית
  greeter-en:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Hello
    ports:
      - "9002:8000"

