
name: ShopList CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Backend - Python syntax check
        run: python3 -m py_compile app/backend/*.py

      - name: Stats - Node syntax check
        run: for f in app/stats/*.js; do node --check "$f"; done

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Chart - helm lint
        run: helm lint helm/shoplist

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [backend, stats, frontend]

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set lowercase owner and image name
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/shoplist-${{ matrix.service }}" >> $GITHUB_ENV
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest ./app/${{ matrix.service }}
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Summary
        run: echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
